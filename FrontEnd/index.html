<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Farming Platform | Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(rgba(0,0,0,0.7),rgba(0,0,0,0.7)), url("bg1.jpeg");
    background-size: cover;
}

/* HEADER */
.page-header{
    position:absolute;
    top:25px;
    text-align:center;
}
.page-header h1{ color:#07a346; font-size:1.9rem; }

/* LOGIN BOX */
.login-box{
    background:#fff;
    width:100%;
    max-width:420px;
    padding:30px 26px;
    border-radius:22px;
    box-shadow:0 15px 35px rgba(0,0,0,0.15);
    text-align:center;
}

/* HIDE RECAPTCHA */
.recaptcha-hidden{ display:none; }

/* ROLE TABS */
.role-tabs{ display:flex; gap:8px; margin-bottom:18px; }
.role-tabs button{
    flex:1; padding:10px; border-radius:12px;
    border:1px solid #bbf7d0; background:#ecfdf5;
    cursor:pointer; font-size:0.85rem; color:#14532d;
}
.role-tabs button.active{ background:#22c55e; color:white; }

/* INPUT */
.input-group{ text-align:left; margin-bottom:18px; }
.input-group label{ font-size:0.85rem; font-weight:bold; }
.input-group input{
    width:100%; padding:14px; margin-top:6px;
    font-size:1rem; border-radius:12px;
    border:1.5px solid #bbf7d0;
}

button.main-btn{
    width:100%; background:#22c55e; border:none;
    color:white; padding:14px; border-radius:14px;
    font-size:1rem; cursor:pointer;
}

#otpSection{
    display:none; margin-top:15px;
    border-top:1px dashed #bbf7d0; padding-top:15px;
}
</style>
</head>

<body>

<div class="page-header">
    <h1>🌱 AGRI TECH</h1>
    <pre style="color: #aaaaaa;">Sustainable Agriculture System</pre>
</div>

<div class="login-box">

    <!-- REQUIRED FOR FIREBASE -->
    <div id="recaptcha-container" class="recaptcha-hidden"></div>

    <div class="role-tabs">
        <button class="active" onclick="setRole('Farmer',this)">Farmer</button>
        <button onclick="setRole('Expert',this)">Expert</button>
        <button onclick="setRole('Customer',this)">Customer</button>
        <button onclick="setRole('Admin',this)">Admin</button>
    </div>

    <h2 id="roleTitle">Farmer Login</h2>
    <p id="roleText">Login using your mobile number</p>

    <div class="input-group">
        <label>📱 Mobile Number</label>
        <input type="tel" id="mobile" placeholder="Enter 10-digit number" maxlength="10">
    </div>

    <button class="main-btn" onclick="sendOTP()">Get OTP</button>

    <div id="otpSection">
        <div class="input-group">
            <label>🔐 Enter OTP</label>
            <input type="number" id="otp" placeholder="Enter OTP">
        </div>
        <button class="main-btn" onclick="verifyOTP()">Login</button>
    </div>
</div>

<!-- FIREBASE COMPAT SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyD_BSYt8eGXxQYH9s9xTAjnZi8yZw6v2eU",
    authDomain: "tensor-v20.firebaseapp.com",
    projectId: "tensor-v20",
    storageBucket: "tensor-v20.appspot.com",
    messagingSenderId: "624488474786",
    appId: "1:624488474786:web:2eb51a3716408bfac88ffb"
  };

  firebase.initializeApp(firebaseConfig);

  const auth = firebase.auth();
  let confirmationResult;
  let currentRole = "Farmer";
  let recaptchaVerifier;

  window.onload = function () {
    recaptchaVerifier = new firebase.auth.RecaptchaVerifier(
      'recaptcha-container',
      { size: 'invisible' }
    );
  };

  function setRole(role, btn){
    currentRole = role;
    document.getElementById("roleTitle").innerText = role + " Login";
    document.querySelectorAll(".role-tabs button")
      .forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("otpSection").style.display = "none";
  }

  function sendOTP(){
    const mobile = document.getElementById("mobile").value;
    if(mobile.length !== 10){
      alert("Enter valid mobile number");
      return;
    }

    auth.signInWithPhoneNumber("+91" + mobile, recaptchaVerifier)
      .then(result => {
        confirmationResult = result;
        alert("OTP sent");
        document.getElementById("otpSection").style.display = "block";
      })
      .catch(err => alert(err.message));
  }

function verifyOTP(){
  const otp = document.getElementById("otp").value;

  confirmationResult.confirm(otp)
    .then(result => {
      alert(currentRole + " login successful!");

      // ✅ ROLE-BASED REDIRECT
      if (currentRole === "Farmer") {
        window.location.href = "farmer.html";
      } 
      else if (currentRole === "Dealer") {
        window.location.href = "dealer.html";
      } 
      else if (currentRole === "Customer") {
        window.location.href = "customer.html";
      } 
      else if (currentRole === "Admin") {
        window.location.href = "admin.html";
      }

      console.log(result.user.phoneNumber);
    })
    .catch(() => {
      alert("Invalid OTP");
    });
}

</script>

</body>
</html>
